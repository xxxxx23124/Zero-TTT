# Zero-TTT interactive GTP baseline for KataGo v1.17.2.
rules = tromp-taylor
logDir = /tmp/katago-gtp
logToStderr = true
logAllGTPCommunication = true
reportAnalysisWinratesAs = SIDETOMOVE
allowResignation = true
resignThreshold = -0.90
resignConsecTurns = 3
maxVisits = 1024
numSearchThreads = 16
ponderingEnabled = false
nnMaxBatchSize = 16
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = false
