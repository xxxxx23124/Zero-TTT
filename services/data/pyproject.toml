[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-ttt-data-service"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "sgfmill==1.1.1",
  "zero-ttt-contracts==1.0.0",
  "zero-ttt-core==1.0.0",
  "zero-ttt-dataset==1.0.0",
  "zero-ttt-game==1.0.0",
  "zero-ttt-worker-runtime==1.0.0",
]

[project.scripts]
zero-ttt-data-worker = "zero_ttt_data.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
