[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-ttt-ui-service"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "click>=8,<8.4",
  "nicegui>=2,<4",
]

[project.scripts]
zero-ttt-ui = "zero_ttt_ui.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
