[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-ttt-admin"
version = "1.0.0"
requires-python = ">=3.12"

[project.scripts]
zero-ttt = "zero_ttt_admin:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

