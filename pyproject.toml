[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-ttt"
version = "0.1.0"
description = "A Docker-only Go student-model training research system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "sgfmill==1.1.1",
  "torch>=2.13,<2.14",
]

[project.scripts]
zero-ttt = "zero_ttt.cli:main"
zero-ttt-agent = "zero_ttt.control.main:main"
zero-ttt-ui = "zero_ttt.dashboard.app:main"

[project.optional-dependencies]
dev = [
  "pyright>=1.1,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]
dashboard = [
  "fastapi>=0.115,<1",
  "nicegui>=2,<4",
  "tensorboard>=2.18,<3",
  "uvicorn>=0.34,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "C90"]
mccabe.max-complexity = 12

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src/zero_ttt"]
exclude = ["third_party"]
