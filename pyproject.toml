[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-ttt"
version = "0.1.0"
description = "A Docker-only Go student-model training research system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "sgfmill==1.1.1",
  "torch>=2.13,<2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
zero-ttt = "zero_ttt.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
