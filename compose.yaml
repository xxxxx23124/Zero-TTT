services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: zero-ttt:torch2.13.0-cuda13.2-cudnn9-devel
    working_dir: /workspace
    gpus: all
    shm_size: 8gb
    init: true
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: .
        target: /workspace
      - huggingface-cache:/cache/huggingface
      - pip-cache:/cache/pip
      - torch-cache:/cache/torch
      - torch-extensions-cache:/cache/torch_extensions
      - uv-cache:/cache/uv
    environment:
      PIP_CACHE_DIR: /cache/pip
      PYTHONPATH: /workspace/src
    command: ["/bin/bash"]

  katago-version:
    profiles: ["katago"]
    build:
      context: .
      dockerfile: docker/katago/Dockerfile
    image: zero-ttt/katago:v1.17.2-cuda13.2
    command: ["version"]

  katago-analysis:
    profiles: ["katago"]
    build:
      context: .
      dockerfile: docker/katago/Dockerfile
    image: zero-ttt/katago:v1.17.2-cuda13.2
    gpus: all
    init: true
    stdin_open: true
    volumes:
      - type: bind
        source: ./models/katago
        target: /models
        read_only: true
      - type: bind
        source: ./configs/katago
        target: /config
        read_only: true
    command:
      - analysis
      - -model
      - /models/${KATAGO_MODEL_FILE:-model.bin.gz}
      - -config
      - /config/analysis.cfg

  katago-gtp:
    profiles: ["katago"]
    build:
      context: .
      dockerfile: docker/katago/Dockerfile
    image: zero-ttt/katago:v1.17.2-cuda13.2
    gpus: all
    init: true
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: ./models/katago
        target: /models
        read_only: true
      - type: bind
        source: ./configs/katago
        target: /config
        read_only: true
    command:
      - gtp
      - -model
      - /models/${KATAGO_MODEL_FILE:-model.bin.gz}
      - -config
      - /config/gtp.cfg

volumes:
  huggingface-cache:
  pip-cache:
  torch-cache:
  torch-extensions-cache:
  uv-cache:
