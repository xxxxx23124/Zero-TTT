services:
  dev:
    volumes:
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/raw
        target: /datasets/raw
        read_only: true
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/staging
        target: /datasets/staging
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/manifests
        target: /datasets/manifests
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/processed
        target: /datasets/processed
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/catalog
        target: /datasets/catalog
