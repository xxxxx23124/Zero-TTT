[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-ttt-contracts"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
