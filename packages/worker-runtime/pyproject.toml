[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-ttt-worker-runtime"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["zero-ttt-contracts==1.0.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
